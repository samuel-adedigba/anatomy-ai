name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript-apps:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Instruction engine
            directory: services/instruction-engine
            command: pnpm test
          - name: API gateway
            directory: services/api-gateway
            command: pnpm build
          - name: Web viewer
            directory: apps/web-viewer
            command: pnpm type-check && pnpm test && pnpm build
          - name: Mobile app
            directory: apps/mobile-app
            command: pnpm type-check && pnpm lint && pnpm exec jest --watchAll=false --runInBand

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ${{ matrix.directory }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: ${{ matrix.command }}
