<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Anatomy AI — Visual Engine</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        color-scheme: dark;
        --canvas: #04090e;
        --surface: rgba(13, 25, 35, 0.92);
        --surface-high: #122330;
        --border: #294150;
        --border-strong: #3b5c6d;
        --text: #f3f8fa;
        --text-second: #b8c7d0;
        --text-muted: #8497a3;
        --accent: #4ed9c6;
        --accent-dim: rgba(78, 217, 198, 0.12);
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--canvas);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #canvas-container { width: 100vw; height: 100vh; }

      /* ── Dev UI overlay (hidden when embedded in WebView) ── */
      #viewer-ui {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        left: max(16px, env(safe-area-inset-left));
        z-index: 20;
        display: flex;
        gap: 18px;
        align-items: center;
        min-height: 58px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 8px 10px 8px 12px;
        color: var(--text);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .viewer-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .viewer-mark {
        position: relative;
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid rgba(78, 217, 198, 0.45);
        border-radius: 10px;
        background: var(--accent-dim);
      }
      .viewer-mark::before,
      .viewer-mark::after {
        content: "";
        position: absolute;
        background: var(--accent);
        border-radius: 999px;
      }
      .viewer-mark::before { width: 15px; height: 2px; }
      .viewer-mark::after { width: 2px; height: 15px; }
      .viewer-title {
        display: block;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .viewer-subtitle {
        display: block;
        margin-top: 2px;
        color: var(--text-muted);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .viewer-field {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #viewer-ui label {
        color: var(--text-muted);
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #view-mode {
        min-width: 170px;
        min-height: 40px;
        background: var(--surface-high);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 7px 34px 7px 10px;
        font-size: 13px;
        cursor: pointer;
      }
      #view-mode:hover { border-color: var(--border-strong); }
      #view-mode:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .embedded #viewer-ui,
      .embedded #hint-overlay,
      .embedded #scene-plan-panel {
        display: none !important;
      }

      #scene-plan-panel {
        position: fixed;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        z-index: 20;
        width: min(430px, calc(100vw - 32px));
        max-height: min(48vh, 520px);
        overflow: auto;
        padding: 16px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      #scene-plan-panel[hidden] { display: none; }
      .scene-plan-kicker {
        color: var(--accent);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #scene-plan-title {
        margin-top: 5px;
        font-size: 14px;
        line-height: 1.4;
      }
      #scene-plan-status {
        margin-top: 5px;
        color: var(--text-muted);
        font-size: 11px;
        line-height: 1.4;
      }
      #scene-plan-steps {
        display: grid;
        gap: 9px;
        margin-top: 14px;
        padding: 0;
        list-style: none;
      }
      #scene-plan-steps li {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 9px;
        color: var(--text-second);
        font-size: 12px;
        line-height: 1.45;
      }
      .scene-step-time {
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }

      /* ── Loading overlay ── */
      #loading-overlay {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 30;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        background: rgba(4, 9, 14, 0.82);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        pointer-events: none;
      }
      #loading-overlay .spinner {
        width: 38px;
        height: 38px;
        border: 3px solid var(--accent-dim);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      #loading-label {
        color: var(--text-second);
        font-size: 13px;
        line-height: 1.4;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── First-use hint (shown briefly, fades out) ── */
      #hint-overlay {
        position: fixed;
        bottom: max(20px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 10px 16px;
        color: var(--text-second);
        font-size: 12px;
        line-height: 1.5;
        text-align: center;
        pointer-events: none;
        animation: fadeInOut 4s ease-in-out forwards;
        white-space: nowrap;
      }
      @keyframes fadeInOut {
        0%   { opacity: 0; }
        15%  { opacity: 1; }
        70%  { opacity: 1; }
        100% { opacity: 0; }
      }

      @media (max-width: 560px) {
        #viewer-ui {
          right: max(12px, env(safe-area-inset-right));
          left: max(12px, env(safe-area-inset-left));
          justify-content: space-between;
          gap: 10px;
        }
        .viewer-subtitle,
        #viewer-ui label {
          display: none;
        }
        #view-mode {
          min-width: 138px;
          max-width: 48vw;
        }
        #hint-overlay {
          max-width: calc(100vw - 24px);
          white-space: normal;
        }
        #scene-plan-panel {
          right: 12px;
          bottom: 12px;
          width: calc(100vw - 24px);
          max-height: 42vh;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #loading-overlay .spinner { animation-duration: 1.8s; }
        #hint-overlay { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <header id="viewer-ui">
      <div class="viewer-brand">
        <span class="viewer-mark" aria-hidden="true"></span>
        <span>
          <h1 class="viewer-title">Anatomy AI</h1>
          <span class="viewer-subtitle">Interactive 3D</span>
        </span>
      </div>
      <div class="viewer-field">
        <label for="view-mode">System</label>
        <select id="view-mode" aria-label="Select anatomy system">
          <option value="full_body">Full body</option>
          <option value="skeleton">Skeleton</option>
          <option value="muscular">Muscles</option>
          <option value="nervous_system">Nervous system</option>
          <option value="circulatory">Circulatory</option>
          <option value="respiratory">Respiratory</option>
          <option value="digestive">Digestive</option>
          <option value="brain">Brain</option>
          <option value="heart">Heart</option>
          <option value="spine">Spine</option>
        </select>
      </div>
    </header>

    <!-- Loading indicator -->
    <div id="loading-overlay" role="status" aria-live="polite" aria-label="Loading model">
      <div class="spinner" aria-hidden="true"></div>
      <span id="loading-label">Loading…</span>
    </div>

    <!-- First-use drag hint — shown for 4 s then fades -->
    <div id="hint-overlay" aria-hidden="true">
      Drag to rotate · Scroll or pinch to zoom
    </div>

    <section
      id="scene-plan-panel"
      aria-live="polite"
      aria-labelledby="scene-plan-title"
      hidden
    >
      <p class="scene-plan-kicker">Planned visual sequence</p>
      <h2 id="scene-plan-title"></h2>
      <p id="scene-plan-status"></p>
      <ol id="scene-plan-steps"></ol>
    </section>

    <div id="canvas-container" role="img" aria-label="3D anatomy viewer"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
